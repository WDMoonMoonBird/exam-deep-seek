# ============================================================================
# electron-builder 配置 —— macOS arm64 / DMG / ad-hoc 签名 / 无公证 / 无自动更新
# 依据 docs/desktop/2026-10-18-electron-desktop-plan.md §4.2；v0 仅内部 DMG 分发。
# 注意：本配置**不含**公证（notarize:false）、不含自动更新（无 publish/updater）、
#       不使用 Developer ID（identity:null）；构建时另设 CSC_IDENTITY_AUTO_DISCOVERY=false。
# ============================================================================
appId: asia.deadpan.exam.desktop
productName: Deadpan 判题
copyright: Copyright © 2026 Deadpan

directories:
  output: release
  buildResources: resources

# 只打包壳代码；前端产物经 extraResources 落到 Resources/dist（不发到 App 内 asar）
files:
  - src/**/*
  - package.json

extraResources:
  - from: ../dist-desktop
    to: dist
    # 包洁癖：构建清单与 macOS 噪声文件不随包分发（legacy 裁剪在 build-dist 阶段完成）
    filter:
      - "**/*"
      - "!**/.DS_Store"
      - "!.desktop-build.json"

asar: true
# 壳无原生依赖，跳过 node-gyp 重建（避免构建机缺工具链）
npmRebuild: false
# ★locale 必须按平台配置（W1 修复）：匹配规则是"想要的 locale 小写后与目录/文件名小写前缀比较"。
#   · macOS：资源是 Resources/*.lproj（zh_CN.lproj / en.lproj）⇒ 用 zh_CN + en
#   · Windows：资源是 locales/*.pak（zh-CN.pak / en-US.pak）⇒ 用 zh-CN + en-US
#   全局写 mac 命名会命中 mac，但 Windows .pak 全不匹配 ⇒ locales 被清空（T28/W1）。

# ad-hoc 重签（见 scripts/after-pack-adhoc-sign.cjs）
afterPack: scripts/after-pack-adhoc-sign.cjs

mac:
  # 应用图标（由 client/resources/icon.png 经 iconset 生成；相对 desktop/ 项目目录）
  icon: resources/icon.icns
  target:
    - target: dmg
      arch: [arm64]
  # identity: null ⇒ 不找 Developer ID；签名由 afterPack 的 codesign --sign - 完成
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  minimumSystemVersion: "13.0"
  category: public.app-category.education
  # macOS 用 .lproj 目录名（下划线）：仅保留中文 + 英文
  electronLanguages:
    - zh_CN
    - en
  extendInfo:
    # 连接校内服务器时需要「本地网络」权限（计划 §4.5）；文案会出现在系统弹窗中
    NSLocalNetworkUsageDescription: 用于连接学校内网的考试服务器。

# ===== Windows（x64 / NSIS / 无签名 / 无自动更新）=====
# 非目标平台签名：不配置 certificateFile/signingHashAlgorithms/signtoolOptions；无 publish/updater。
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  artifactName: Deadpan-${version}-x64.${ext}
  # Windows 用 locales/*.pak 文件名（连字符）：仅保留 en-US + zh-CN（W1 修复）
  electronLanguages:
    - en-US
    - zh-CN

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  # 无代码签名（内部试用）；SmartScreen 提示可接受

dmg:
  artifactName: Deadpan-${version}-arm64.dmg
  title: ${productName}
