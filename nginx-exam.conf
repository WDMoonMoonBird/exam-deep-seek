# ============================================
# Nginx HTTPS 配置 — Exam-DeepSeek
# 将本文件 include 到 nginx.conf 的 http{} 块中
# 或用此内容替换 nginx.conf 中的 server 块
# ============================================

# WebSocket 透传：只有 Upgrade 请求才向服务端发 Connection: upgrade，普通请求用 close。
# 本文件含两个 server 块，本身也只能被 include 到 nginx.conf 的 http{} 上下文（map 的合法位置）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ===== CSP（R2-B69）：由 nginx 下发，覆盖"送 SPA 外壳"的文档请求 =====
# 为什么必须放 nginx：线上 HTML 由 nginx 直供（不经 Express）⇒ 仅靠 Express 中间件时，enforce 对 SPA 是"看似保护、实际未保护"（C57 实证）。
# ★为什么必须在**这里**（http 上下文）：map 只允许出现在 http 块 —— 原文件把 map 写在 server{} **内部**（非法位置）；
#   nginx 加载时会以「map directive is not allowed here」拒绝该配置 ⇒ 该 CSP 永远不可能生效，这是 H9 的根因之一（不只是"没被 add_header 引用"）。
# 单一真源 = map $exam_csp_policy；删掉本 map 与 server 块里的 add_header 即回滚（换成 Content-Security-Policy-Report-Only 即观察模式）。
# ★策略串必须与 server/src/middleware/csp.js 的 buildCspDirectives() 保持一致（改一处要同步另一处）。
map $host $exam_csp_policy {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; frame-src 'self'; form-action 'self'; manifest-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; child-src 'self' blob:";
}

# ===== 边缘限流兜底（L10）：全站限流不能只靠应用层（内存态、单进程、重启即清零）=====
# 阈值必须**宽于应用层**（应用层是"账号 10 次失败 / 5 分钟"与 IP 维度），边缘只做粗粒度兜底，避免误伤正常用户。
# 位置要求：limit_req_zone / limit_conn_zone 只能放在 http 上下文（本文件即被 include 到 http{}，与上面的 map 同层）。
limit_req_zone $binary_remote_addr zone=exam_api_rl:20m rate=50r/s;
limit_req_zone $binary_remote_addr zone=exam_login_rl:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=exam_conn:10m;

# ===== M15：隐私路径（教师/学生/管理）的文档响应补 noindex；公开页（login/doc/doc/demos）不限制 =====
# 为什么键用 $request_uri 而不是 $uri：try_files 末项 /exam/index.html 是**内部重定向**，$uri 会被改写成
#   /exam/index.html（于是匹配不上隐私前缀）⇒ 只有 $request_uri 保持原始请求 URI，头才不会在重定向后丢失。
# 空值语义：nginx 的 add_header 在变量求值为空串时**不下发**该头 ⇒ 公开页不会出现空的 X-Robots-Tag。
map $request_uri $exam_robots_tag {
    default "";
    ~^/exam/(teacher|student|admin)(/|$) "noindex, nofollow";
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name deadpan.asia;

    # ===== 网关级基线（L9 / M13 / L10 状态码）=====
    server_tokens off;            # ★L9：Server 头与 nginx 错误页不再回显版本号
    client_max_body_size 12m;     # ★M13：与后端 express.json({limit:"10mb"}) 对齐（12m 留 multipart/表单封装余量）；
                                  #   不设时 nginx 默认 1m ⇒ 1–10MB 请求被边缘先行 413，配置意图与实际生效分叉
    limit_req_status 429;         # ★L10：边缘限流回 429（与应用层限流口径一致；429 已在 40x 错误页清单内）
    limit_conn_status 429;

    # ===== 安全响应头（H9 / H10 / M15）=====
    # ★放置原则：**全部放 server 级**。nginx 的 add_header 是"就近覆盖"：子块只要出现**任意**一条 add_header，
    #   父块的全部 add_header 就都不再继承 ⇒ 放 server 级可覆盖所有 location；且 try_files 的兜底是内部重定向，
    #   重定向后的 location 若无 add_header 仍继承 server 级 ⇒ 头不会被"丢"。
    # ★全部带 always：否则非 2xx（404/413/429/5xx）不下发这些头，而错误页恰恰是最容易被探测的响应。
    add_header Content-Security-Policy $exam_csp_policy always;                # ★H9：map 变量在此**真正下发**（此前定义为 0 处引用）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # ★H10
    add_header X-Content-Type-Options nosniff always;                          # ★H10
    add_header X-Frame-Options SAMEORIGIN always;                              # ★H10（与 CSP frame-ancestors 'self' 同口径）
    add_header Referrer-Policy strict-origin-when-cross-origin always;         # ★H10
    add_header X-Robots-Tag $exam_robots_tag always;                           # ★M15：隐私路径 noindex（公开页变量为空 ⇒ 不下发）

    # ===== SSL 证书 =====
    ssl_certificate      C:/nginx/conf/ssl/ssl.crt;
    ssl_certificate_key  C:/nginx/conf/ssl/ssl.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ===== gzip =====
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1k;
    gzip_comp_level 6;

    # （★W2-P1/H9：CSP 的 map 已移出 server{} 到 http 上下文 —— 见文件顶部；`map` 在 server 块内是非法位置。）
    # ★易错点（上线时真踩过）：`add_header` 在同一 location 内会"覆盖"而非叠加；
    #   且 `try_files ... /exam/index.html` 属内部重定向 ⇒ 请求最终由 `location = /exam/index.html` 处理，
    #   该块自身有 add_header ⇒ 上游 location 的 CSP 头会被丢弃。所以头必须同时加在"外壳 location"与 index.html 那条块上。
    # 落地位置（线上实测 7 条路径均带头且 200）：= /exam/login、= /exam/doc、= /exam/doc/demos、
    #   ~ ^/exam/(teacher|student|admin)(/|$)、/exam/、= /exam/index.html

    # ===== 服务器级错误页（覆盖所有路径，含根级未知路径）=====
    # 为什么必须放在 server 级：location 内的 error_page 只管该 location，
    #   而 /exam1、/foo、/wp-login.php 这类"根级未知路径"不匹配任何 location ⇒ 会落到 nginx 默认 404 页。
    # 注意：本 server 块下其它站点（c_game / rainbowfart / mrs / dev-signal）的同类错误也会显示这些页面；
    #   若某些站点需要自己的错误页，在其 location 内覆写 error_page 即可（location 级优先）。
    # ★依赖构建产物：client/public/error-pages/*.html → dist/error-pages/*.html（已在 CI/本地构建时生成）
    # ★40x（400/401/403/405/408/409/410/413/418/429）当前由 403.html 复制而来 —— 若要每个码一张，改前端生成脚本即可
    error_page 400 401 403 405 408 409 410 413 418 429 /exam/error-pages/40x.html;
    error_page 404 /exam/error-pages/404.html;
    error_page 500 501 502 503 504 /exam/error-pages/500.html;

    # ===== Socket.IO WebSocket =====
    # 服务端 socket.io 挂在**根路径** /socket.io（server/src/socket.js initSocket 未指定 path）；
    # 生产构建（VITE_WS_URL 为空）走同源根路径 → 命中本块。
    location /socket.io/ {
        proxy_pass http://127.0.0.1:50001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 长连接：nginx 默认 proxy_read_timeout 60s 会掐断空闲的 WebSocket / polling 会话
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ===== Socket.IO：/exam/socket.io（当前客户端的默认路径）=====
    # 历史（缺陷 D2）：旧前端（972dec64 起）把 socket 路径写死为 /exam/socket.io，而当时 nginx **只**代理根路径
    #   /socket.io/ ⇒ 该路径落进 location /exam/ 的静态块，返回 SPA HTML（200 text/html，永远不是 101），实时刷新失效；
    #   当时的"修法"是把客户端改回根路径 /socket.io —— 但生产网关不映射根路径（只暴露 /exam/ 前缀）⇒ 依然连不上（实测 404）。
    # 现状（R2-B53）：本 location 已存在，且客户端默认 path 改回 /exam/socket.io（VITE_WS_PATH / VITE_WS_URL 可覆盖）。
    #   实测握手：curl "https://<host>/exam/socket.io/?EIO=4&transport=polling" ⇒ 200 + {"sid":…}；对照根路径 ⇒ 404。
    # nginx 前缀 location 取最长匹配 ⇒ 本块（更长前缀）胜过 location /exam/，与书写先后无关。
    # ★端口口径：本文件是模板（上游 50001）；云上实际用的是 3002 ⇒ 以云上 `nginx -T` 为准。
    location /exam/socket.io/ {
        proxy_pass http://127.0.0.1:50001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ===== 考试系统 /exam =====
    # 错误状态码口径（与线上云主机一致，见 docs/api/2026-10-13-错误状态码后端回复.md）：
    #   ① 公开入口短名单（前缀白名单方案 A）：只对白名单路径送 SPA 外壳，其余 /exam/* 一律 404
    #   ② 像文件名的路径在静态层直接 404，不落外壳；但必须排除 /exam/api/ 与 /exam/socket.io/
    #      （正则 location 优先于前缀 location，不排除会把带扩展名的 API 路径抢走）
    #   ③ 错误页产物由前端构建产出：client/public/error-pages/*.html → dist/error-pages/*.html
    #   ④ API 路径的 413 返回 JSON（SPA 要解析 message）；502/503/504 交给错误页
    location /exam/api/ {
        # ★L10：边缘兜底（50r/s + burst 100）。应用层不设全局限流 ⇒ 这层只挡"明显异常"的洪水，
        #   阈值远宽于任何正常交互（前端一个页面并发请求数十条），避免误伤。
        limit_req zone=exam_api_rl burst=100 nodelay;
        limit_conn exam_conn 60;
        proxy_pass http://127.0.0.1:50001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors on;
        error_page 502 503 504 /exam/error-pages/502.html;
        error_page 413 = @api413;
        error_page 429 = @api429;   # ★L10：API 的 429 必须是 JSON（SPA 要解析 message，HTML 错误页会解析失败）
    }

    location @api413 {
        default_type application/json;
        return 413 '{"code":1403,"message":"文件超过大小限制","data":null}';
    }

    location @api429 {
        default_type application/json;
        return 429 '{"code":1003,"message":"请求过于频繁，请稍后再试","data":null}';
    }

    # ★L10：登录端点单独一档更严的边缘限流。精确匹配（`=`）优先级最高 ⇒ 本块不会被 /exam/api/ 或正则块抢走。
    #   阈值 20r/s + burst 40 仍**远宽于**应用层的"账号 10 次失败 / 5 分钟"口径（应用层才是认证判定，边缘只兜底）。
    location = /exam/api/auth/login {
        limit_req zone=exam_login_rl burst=40 nodelay;
        limit_conn exam_conn 20;
        proxy_pass http://127.0.0.1:50001/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors on;
        error_page 502 503 504 /exam/error-pages/502.html;
        error_page 413 = @api413;
        error_page 429 = @api429;
    }

    # 不带末尾斜杠的 /exam → 301 到 /exam/：前缀 location 匹配要求末尾斜杠，
    # 否则用户手敲 https://host/exam 会 404（dev 侧由 vite 的 base-slash-redirect 插件对齐同一行为）
    location = /exam {
        return 301 /exam/;
    }

    # ① 精确匹配 → 送外壳（公开可爬页面）
    location = /exam/login      { try_files /exam/index.html =404; }
    location = /exam/doc        { try_files /exam/index.html =404; }
    location = /exam/doc/demos  { try_files /exam/index.html =404; }
    # ② 前缀匹配 → 送外壳（登录后应用区，前缀内未匹配的具体路由由前端 404 页接管）
    #    ★与前端 router 一级前缀保持一致：client/src/router/index.js（新增前缀需同步，建议加断言）
    location ~ ^/exam/(teacher|student|admin)(/|$) { try_files $uri $uri/ /exam/index.html; }
    # ★I3（纵深）：source map 永不外发 —— 当前产物实测 0 个 .map，属**潜在**面：
    #   下面 /exam/ 用 `alias` 直出 dist/，一旦构建带上 map 就会被公开下载（等于交出源码）。
    #   ★顺序要求：nginx 的**正则 location 按书写顺序匹配** ⇒ 本块必须写在"像文件名的路径"那条正则**之前**，否则会被它先吃掉。
    location ~* \.map$ { return 404; }

    # ②b 像文件名的路径 → 静态层 404（排除 api 与 socket.io，正则需加引号：含 {} 时 nginx 会误判块起始）
    location ~* "^/exam/(?!api/|socket\.io/).+\.[a-z0-9]{2,5}$" { try_files $uri =404; }

    # ③ 其余 /exam/* → 404（原为 try_files ... /exam/index.html 的兜底，会让未知路径返回 200）
    location /exam/ {
        alias C:/inetpub/wwwroot/exam-deep-seek/client/dist/;
        try_files $uri $uri/ =404;
        error_page 404 /exam/error-pages/404.html;
        error_page 500 502 503 504 /exam/error-pages/500.html;
    }

    # ===== 其他服务可在此添加 =====
    # location /other-service/ { ... }
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name deadpan.asia;
    return 301 https://$host$request_uri;
}
