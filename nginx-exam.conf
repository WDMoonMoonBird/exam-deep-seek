# ============================================
# Nginx HTTPS 配置 — Exam-DeepSeek
# 将本文件 include 到 nginx.conf 的 http{} 块中
# 或用此内容替换 nginx.conf 中的 server 块
# ============================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name deadpan.asia;

    # ===== SSL 证书 =====
    ssl_certificate      C:/nginx/conf/ssl/ssl.crt;
    ssl_certificate_key  C:/nginx/conf/ssl/ssl.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ===== gzip =====
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1k;
    gzip_comp_level 6;

    # ===== Socket.IO WebSocket =====
    location /socket.io/ {
        proxy_pass http://127.0.0.1:50001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ===== 考试系统 /exam =====
    location /exam/api/ {
        proxy_pass http://127.0.0.1:50001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /exam/ {
        alias C:/inetpub/wwwroot/exam-deep-seek/client/dist/;
        try_files $uri $uri/ /exam/index.html;
    }

    # ===== 其他服务可在此添加 =====
    # location /other-service/ { ... }
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name deadpan.asia;
    return 301 https://$host$request_uri;
}
