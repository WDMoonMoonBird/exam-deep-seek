<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>我的 · 移动端设计稿</title>
<link rel="stylesheet" href="../../../../client/src/styles/tokens.css">
<link rel="stylesheet" href="../../02-design-tokens.css">
<link rel="stylesheet" href="../assets/screen.css">
<style>
  /* 我的页面局部样式（pf- 前缀），只使用令牌变量 */
  .pf-head { display: flex; align-items: center; padding: 8px var(--m-gutter) 16px; }
  .pf-head .iconbtn { color: var(--text-tertiary); }
  .pf-id { flex: 1; min-width: 0; margin-left: 14px; }
  .pf-name { display: flex; align-items: center; font-size: 21px; line-height: 1.3; font-weight: var(--m-fw-bold); letter-spacing: var(--m-tracking-tight); }
  .pf-name .tag { margin-left: 8px; height: 21px; font-size: 11px; }
  .pf-sub { margin-top: 3px; font-size: var(--m-fs-body-sm); color: var(--text-secondary); }
  .pf-stats .stat { padding: 12px 12px; }
  .pf-stats .stat .v { font-size: 21px; }
  .pf-stats .stat .k { white-space: normal; line-height: 1.4; }
  .pf-row { width: 100%; text-align: left; }
  .pf-row .row-main { display: flex; flex-direction: column; }
  .pf-row .row-sub { display: block; }
  .pf-value { flex: none; margin-left: auto; padding-left: 10px; font-size: 13.5px; color: var(--text-tertiary); }
  .pf-row .chevron { flex: none; }
  .pf-row-btn { align-items: center; }
  /* 开关：视觉保持 31px 高，点击区域扩到 44px（用轨道伪元素承载视觉，按钮本体 51×44） */
  .pf-switch { position: relative; flex: none; margin-left: 10px; width: 51px; height: var(--m-touch-min); background: transparent; border-radius: var(--m-radius-chip); }
  .pf-switch::before { content: ""; position: absolute; left: 0; right: 0; top: 6.5px; height: 31px; border-radius: var(--m-radius-chip); background: var(--border-strong); transition: background var(--m-duration-base); transform: none; }
  .pf-switch::after { top: 8.5px; }
  .pf-switch.on { background: transparent; }
  .pf-switch.on::before { background: var(--green-600); }
  .pf-group-title { display: flex; align-items: center; font-size: 12px; font-weight: var(--m-fw-semibold); color: var(--text-tertiary); padding: 0 var(--m-gutter); margin: 22px 0 8px; letter-spacing: 0.02em; }
  .pf-foot { margin: 20px var(--m-gutter) 4px; }
  .pf-foot-note { margin-top: 10px; text-align: center; font-size: 11.5px; line-height: 1.6; color: var(--text-tertiary); }
  .pf-logout .icon { margin-right: 6px; }
</style>
</head>
<body class="screen" data-screen="student-profile" data-bottom="tabbar">
  <div data-tabbar="student" data-active="me"></div>

  <div class="app">
    <main class="scroll">
      <header class="pf-head">
        <button type="button" class="avatar avatar--xl avatar--brand" aria-label="更换头像">李</button>
        <div class="pf-id">
          <div class="pf-name">李明<span class="tag tag--info">学生</span></div>
          <div class="pf-sub">学号 2026001004 · 计算机 2301 班</div>
          <div class="pf-sub">Deadpan 大学 · 计算机学院</div>
        </div>
        <button type="button" class="iconbtn" aria-label="账号与设置"><span data-icon="settings"></span></button>
      </header>

      <div class="page">
        <div class="stats stats--3 pf-stats">
          <div class="stat"><div class="v">3</div><div class="k">已完成作业</div></div>
          <div class="stat"><div class="v">85.3</div><div class="k">学期平均分</div></div>
          <div class="stat"><div class="v">6/45</div><div class="k">班级排名</div></div>
        </div>
      </div>

      <div class="pf-group-title">偏好设置</div>
      <div class="page">
        <div class="list">
          <div class="rowitem pf-row">
            <span class="rowicon rowicon--neutral" aria-hidden="true"><span data-icon="moon"></span></span>
            <span class="row-main">
              <span class="row-title">深色主题</span>
              <span class="row-sub">当前浅色 · 深色环境更省电</span>
            </span>
            <button type="button" class="switch pf-switch" id="pf-theme-switch" role="switch" aria-checked="false" aria-label="深色主题"></button>
          </div>
          <button type="button" class="rowitem rowitem--tap pf-row pf-row-btn" aria-label="字号大小，当前为标准">
            <span class="rowicon rowicon--neutral" aria-hidden="true"><span data-icon="eye"></span></span>
            <span class="row-main">
              <span class="row-title">字号大小</span>
              <span class="row-sub">当前标准 · 正文 15px</span>
            </span>
            <span class="pf-value">标准</span>
            <span class="chevron" data-icon="chevron-right" aria-hidden="true"></span>
          </button>
          <div class="rowitem pf-row">
            <span class="rowicon rowicon--neutral" aria-hidden="true"><span data-icon="bell"></span></span>
            <span class="row-main">
              <span class="row-title">通知提醒</span>
              <span class="row-sub">截止提醒、出分通知</span>
            </span>
            <button type="button" class="switch on pf-switch" data-switch role="switch" aria-checked="true" aria-label="通知提醒"></button>
          </div>
        </div>
      </div>

      <div class="pf-group-title">更多</div>
      <div class="page">
        <div class="list">
          <button type="button" class="rowitem rowitem--tap pf-row pf-row-btn" data-goto="public-doc" aria-label="使用文档">
            <span class="rowicon rowicon--neutral" aria-hidden="true"><span data-icon="book"></span></span>
            <span class="row-main">
              <span class="row-title">使用文档</span>
              <span class="row-sub">作答、提交与查看成绩的说明</span>
            </span>
            <span class="chevron" data-icon="chevron-right" aria-hidden="true"></span>
          </button>
          <button type="button" class="rowitem rowitem--tap pf-row pf-row-btn" aria-label="帮助与反馈">
            <span class="rowicon rowicon--neutral" aria-hidden="true"><span data-icon="message"></span></span>
            <span class="row-main">
              <span class="row-title">帮助与反馈</span>
              <span class="row-sub">遇到问题？联系任课教师或信息中心</span>
            </span>
            <span class="chevron" data-icon="chevron-right" aria-hidden="true"></span>
          </button>
          <div class="rowitem pf-row">
            <span class="rowicon rowicon--neutral" aria-hidden="true"><span data-icon="info"></span></span>
            <span class="row-main">
              <span class="row-title">关于 Deadpan 判题</span>
              <span class="row-sub">AI 评分 · 教学评测平台</span>
            </span>
            <span class="pf-value tnum">v2.1.0</span>
            <span class="chevron" data-icon="chevron-right" aria-hidden="true"></span>
          </div>
        </div>
      </div>

      <div class="pf-foot">
        <button type="button" class="btn btn--danger-soft btn--block pf-logout"><span data-icon="logout" aria-hidden="true"></span>退出登录</button>
        <p class="pf-foot-note">退出后需重新登录；未提交的草稿会保留在本机 7 天。</p>
      </div>
    </main>
  </div>

  <script src="../assets/screens.js"></script>
  <script src="../assets/screen.js"></script>
  <script>
    (function () {
      var sw = document.getElementById("pf-theme-switch");
      if (!sw) return;
      var sub = sw.closest(".rowitem").querySelector(".row-sub");
      function sync() {
        var dark = document.documentElement.getAttribute("data-theme") === "dark";
        sw.classList.toggle("on", dark);
        sw.setAttribute("aria-checked", dark ? "true" : "false");
        if (sub) sub.textContent = dark ? "当前深色 · 深色环境更省电" : "当前浅色 · 深色环境更省电";
      }
      sync();
      sw.addEventListener("click", function () {
        var dark = document.documentElement.getAttribute("data-theme") !== "dark";
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        sync();
      });
    })();
  </script>
</body>
</html>
