<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>学生首页 · 移动端设计稿</title>
<link rel="stylesheet" href="../../../../client/src/styles/tokens.css">
<link rel="stylesheet" href="../../02-design-tokens.css">
<link rel="stylesheet" href="../assets/screen.css">
<style>
  /* 首页局部样式（sh- 前缀），只使用令牌变量 */
  .sh-head { display: flex; align-items: center; padding: 6px var(--m-gutter) 12px; }
  .sh-hello { font-size: var(--m-fs-display); line-height: var(--m-lh-display); font-weight: var(--m-fw-bold); letter-spacing: var(--m-tracking-tight); }
  .sh-hello-sub { margin-top: 4px; font-size: var(--m-fs-body-sm); color: var(--text-secondary); }
  .sh-bell { position: relative; color: var(--text-secondary); margin-left: 4px; }
  .sh-bell-dot { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; min-width: 8px; padding: 0; border-radius: 50%; background: var(--red-600); box-shadow: 0 0 0 2px var(--bg-canvas); }
  .sh-avatar { margin-left: 8px; width: 44px; height: 44px; font-size: 16px; }
  .sh-alllink { display: inline-flex; align-items: center; min-height: var(--m-touch-min); padding: 0 2px; margin-right: -2px; }
  .sh-todo { position: relative; overflow: hidden; padding-left: 18px; }
  .sh-todo::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--status-warning-fg); }
  .sh-todo-left { font-size: var(--m-fs-caption); color: var(--status-warning-fg); font-weight: var(--m-fw-medium); }
  .sh-todo-title { margin-top: 10px; font-size: var(--m-fs-title-2); line-height: var(--m-lh-title-2); font-weight: var(--m-fw-semibold); letter-spacing: var(--m-tracking-tight); }
  .sh-todo-sub { margin-top: 5px; font-size: var(--m-fs-body-sm); color: var(--text-secondary); }
  .sh-progress { display: flex; align-items: center; margin-top: 12px; }
  .sh-progress .bar { flex: 1; }
  .sh-progress-num { margin-left: 10px; font-size: var(--m-fs-caption); color: var(--text-secondary); font-weight: var(--m-fw-medium); }
  .sh-todo-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border-subtle); }
  .sh-hint { display: inline-flex; align-items: center; font-size: 12px; color: var(--text-tertiary); }
  .sh-hint .icon { width: 14px; height: 14px; margin-right: 4px; flex: none; }
  .sh-todo-act { flex: none; margin-left: 10px; height: 44px; padding: 0 16px; border-radius: 12px; font-size: 14px; }
  .sh-todo-act .icon { margin: 0 0 0 5px; }
  .sh-quick { display: grid; grid-template-columns: repeat(3, 1fr); grid-gap: 10px; gap: 10px; }
  .sh-quick-item { display: flex; flex-direction: column; align-items: flex-start; padding: 12px; text-align: left; min-height: 100px; }
  .sh-quick-icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--bg-selected); color: var(--text-brand); }
  .sh-quick-icon .icon { width: 19px; height: 19px; }
  .sh-quick-label { margin-top: 9px; font-size: 14px; font-weight: var(--m-fw-semibold); color: var(--text-primary); }
  .sh-quick-sub { margin-top: 1px; font-size: 11px; color: var(--text-tertiary); white-space: nowrap; }
  .sh-row { display: flex; align-items: center; width: 100%; text-align: left; }
  .sh-row .row-main { display: flex; flex-direction: column; }
  .sh-row .row-sub { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sh-row .row-side { display: flex; align-items: center; }
  .sh-row-score { font-size: 22px; font-weight: var(--m-fw-bold); line-height: 1; letter-spacing: -0.02em; color: var(--score-excellent); font-variant-numeric: tabular-nums; }
  .sh-row .tag { margin-left: 7px; }
  .sh-update { margin: 18px 0 4px; text-align: center; font-size: 11.5px; color: var(--text-tertiary); }
  .sh-update .icon { width: 13px; height: 13px; margin-right: 3px; vertical-align: -2px; }
</style>
</head>
<body class="screen" data-screen="student-home" data-bottom="tabbar">
  <div data-tabbar="student" data-active="home"></div>

  <div class="app">
    <main class="scroll">
      <header class="sh-head">
        <div class="grow">
          <p class="sh-hello">下午好，李明</p>
          <p class="sh-hello-sub">计算机 2301 班 · 今天有 1 份作业截止</p>
        </div>
        <button type="button" class="iconbtn sh-bell" data-goto="student-assignments" aria-label="通知与待办，2 条未读">
          <span data-icon="bell"></span>
          <span class="sh-bell-dot" aria-hidden="true"></span>
        </button>
        <button type="button" class="avatar avatar--brand sh-avatar" data-goto="student-profile" aria-label="进入我的主页">李</button>
      </header>

      <div class="page">
        <article class="card sh-todo" aria-labelledby="sh-todo-title">
          <div class="between">
            <span class="tag tag--warning"><i class="dot"></i>今天 23:59 截止</span>
            <span class="sh-todo-left tnum">剩余 7 小时 27 分</span>
          </div>
          <h2 class="sh-todo-title" id="sh-todo-title">数据结构实验三：图的最短路径</h2>
          <p class="sh-todo-sub">6 题已答 4 题 · 还有 2 道编程题 · 任课教师 周子轩</p>
          <div class="sh-progress">
            <div class="bar" role="progressbar" aria-label="作答进度" aria-valuemin="0" aria-valuemax="6" aria-valuenow="4"><i style="width:66%"></i></div>
            <span class="sh-progress-num tnum">4/6 题</span>
          </div>
          <div class="sh-todo-foot">
            <span class="sh-hint"><span data-icon="alert" aria-hidden="true"></span>提交后不可修改，可提前交卷</span>
            <button type="button" class="btn btn--primary btn--sm sh-todo-act" data-goto="student-answer-objective">
              继续作答<span data-icon="arrow-right" aria-hidden="true"></span>
            </button>
          </div>
        </article>
      </div>

      <section class="page mt20" aria-label="快捷入口">
        <div class="sh-quick">
          <button type="button" class="card sh-quick-item" data-goto="student-assignments">
            <span class="sh-quick-icon" aria-hidden="true"><span data-icon="assignments"></span></span>
            <span class="sh-quick-label">我的作业</span>
            <span class="sh-quick-sub">4 份 · 1 份待交</span>
          </button>
          <button type="button" class="card sh-quick-item" data-goto="student-scores">
            <span class="sh-quick-icon" aria-hidden="true"><span data-icon="scores"></span></span>
            <span class="sh-quick-label">我的成绩</span>
            <span class="sh-quick-sub">3 门已出分</span>
          </button>
          <button type="button" class="card sh-quick-item" data-goto="public-doc">
            <span class="sh-quick-icon" aria-hidden="true"><span data-icon="book"></span></span>
            <span class="sh-quick-label">使用文档</span>
            <span class="sh-quick-sub">作答与提交帮助</span>
          </button>
        </div>
      </section>

      <div class="sec">
        <h2>最近成绩</h2>
        <button type="button" class="link sh-alllink" data-goto="student-scores">全部成绩<span data-icon="chevron-right" aria-hidden="true"></span></button>
      </div>
      <div class="page">
        <div class="list">
          <button type="button" class="rowitem rowitem--tap sh-row" data-goto="student-score-detail" aria-label="查看 Java 程序设计期末考试成绩，92 分，等级 A">
            <span class="rowicon" aria-hidden="true"><span data-icon="scores"></span></span>
            <span class="row-main">
              <span class="row-title">Java 程序设计期末考试</span>
              <span class="row-sub">2026-09-28 · 6 题 · 96 分钟</span>
            </span>
            <span class="row-side">
              <span class="sh-row-score">92</span>
              <span class="tag tag--success">A</span>
            </span>
            <span class="chevron" data-icon="chevron-right" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <div class="sec">
        <h2>即将开始</h2>
        <span class="sec-note">提前 5 分钟提醒</span>
      </div>
      <div class="page">
        <div class="list">
          <div class="rowitem">
            <span class="rowicon rowicon--neutral" aria-hidden="true"><span data-icon="clock"></span></span>
            <span class="row-main">
              <span class="row-title">数据库原理期中测验</span>
              <span class="row-sub">10 月 20 日 09:00 开放 · 20 题 · 限时 60 分钟</span>
            </span>
            <span class="tag tag--neutral">未开始</span>
          </div>
        </div>
        <p class="sh-update"><span data-icon="refresh" aria-hidden="true"></span>数据更新于 16:30 · 下拉可刷新</p>
      </div>
    </main>
  </div>

  <script src="../assets/screens.js"></script>
  <script src="../assets/screen.js"></script>
</body>
</html>
