<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>作答 · 客观题 · 移动端设计稿</title>
<link rel="stylesheet" href="../../../../client/src/styles/tokens.css">
<link rel="stylesheet" href="../../02-design-tokens.css">
<link rel="stylesheet" href="../assets/screen.css">
<style>
  /* 作答页局部样式（ao- 前缀），只使用令牌变量 */
  .ao-exam { display: flex; align-items: center; padding: 0 var(--m-gutter) 12px; }
  .ao-timer { display: inline-flex; align-items: center; flex: none; font-size: 14px; font-weight: var(--m-fw-semibold); color: var(--status-warning-fg); font-variant-numeric: tabular-nums; }
  .ao-timer .icon { width: 17px; height: 17px; margin-right: 5px; flex: none; }
  .ao-bar { flex: 1; margin: 0 12px; }
  .ao-count { flex: none; font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .ao-sheetbtn { position: relative; color: var(--text-primary); }
  .ao-badge { position: absolute; top: -1px; right: -2px; min-width: 28px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--red-600); color: #fff; font-size: 10px; line-height: 17px; font-weight: var(--m-fw-semibold); text-align: center; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 2px var(--bg-canvas); }
  .ao-q { padding: 16px; }
  .ao-q-head { display: flex; align-items: center; justify-content: space-between; }
  .ao-q-meta { display: flex; align-items: center; }
  .ao-q-meta .tag + .tag { margin-left: 6px; }
  .ao-score { margin-left: 8px; font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .ao-mark { display: inline-flex; align-items: center; justify-content: center; height: var(--m-touch-min); padding: 0 12px; border-radius: 10px; color: var(--text-secondary); font-size: 13px; font-weight: var(--m-fw-medium); background: var(--bg-surface-2); border: 1px solid var(--border-subtle); }
  .ao-mark .icon { width: 16px; height: 16px; margin-right: 4px; }
  .ao-mark:active { background: var(--bg-hover); }
  .ao-mark.selected { background: var(--status-warning-bg); border-color: var(--status-warning-bd); color: var(--status-warning-fg); }
  .ao-stem { margin-top: 12px; font-size: 17px; line-height: 1.6; font-weight: var(--m-fw-semibold); letter-spacing: var(--m-tracking-tight); }
  .ao-key { width: 20px; flex: none; font-size: 15px; font-weight: var(--m-fw-semibold); color: var(--text-tertiary); margin-right: 8px; }
  .option.selected .ao-key { color: var(--text-brand); }
  .ao-opt-text { flex: 1; min-width: 0; }
  .ao-tip { display: flex; align-items: flex-start; margin-top: 14px; font-size: 12px; line-height: 1.5; color: var(--text-tertiary); }
  .ao-tip .icon { width: 14px; height: 14px; margin-right: 5px; margin-top: 1px; flex: none; }
  .ao-note { margin-top: 12px; }
  .ao-actionbar .btn--secondary { flex: 0 0 26%; }
  .ao-actionbar .btn--primary { flex: 1; }
  .ao-actionbar .btn--danger-soft { flex: 0 0 24%; padding: 0; font-size: 15px; }
  .ao-saved { display: inline-flex; align-items: center; color: var(--status-success-fg); }
  .ao-saved .icon { width: 13px; height: 13px; margin-right: 3px; }
</style>
</head>
<body class="screen" data-screen="student-answer-objective" data-bottom="actionbar">

  <div class="app">
    <header class="appbar appbar--bordered">
      <div class="appbar-side">
        <button type="button" class="iconbtn" data-icon="back" aria-label="退出作答，返回作业详情（草稿会自动保存）" data-goto="student-assignment-detail"></button>
      </div>
      <h1 class="appbar-title">数据结构实验三<small>第 3 / 6 题 · 还剩 2 道编程题</small></h1>
      <div class="appbar-actions">
        <button type="button" class="iconbtn ao-sheetbtn" data-goto="student-answer-sheet" aria-label="打开答题卡，已答 4 / 6 题">
          <span data-icon="grid"></span>
          <span class="ao-badge" aria-hidden="true">4/6</span>
        </button>
      </div>
    </header>

    <main class="scroll">
      <div class="ao-exam">
        <span class="ao-timer"><span data-icon="clock" aria-hidden="true"></span><span class="tnum">42:18</span></span>
        <div class="bar ao-bar" role="progressbar" aria-label="题目进度" aria-valuemin="0" aria-valuemax="6" aria-valuenow="3"><i style="width:50%"></i></div>
        <span class="ao-count">3/6</span>
      </div>

      <div class="page">
        <article class="card ao-q" aria-labelledby="ao-stem">
          <div class="ao-q-head" data-select-group="single">
            <div class="ao-q-meta">
              <span class="tag tag--info">单选题</span>
              <span class="tag tag--neutral">第 3 题</span>
              <span class="ao-score">5 分</span>
            </div>
            <button type="button" class="ao-mark" data-select aria-pressed="false" aria-label="标记本题，方便稍后检查">
              <span data-icon="star" aria-hidden="true"></span>标记本题
            </button>
          </div>
          <h2 class="ao-stem" id="ao-stem">使用 Dijkstra 算法求单源最短路径时，下列哪种情况会导致算法得到错误结果？</h2>

          <div class="options mt16" data-select-group="single" role="radiogroup" aria-label="单选题选项">
            <button type="button" class="option" data-select role="radio" aria-checked="false">
              <span class="radio" aria-hidden="true"></span><span class="ao-key" aria-hidden="true">A</span><span class="ao-opt-text">图中存在权值为 0 的边</span>
            </button>
            <button type="button" class="option selected" data-select role="radio" aria-checked="true">
              <span class="radio on" aria-hidden="true"></span><span class="ao-key" aria-hidden="true">B</span><span class="ao-opt-text">图中存在负权边</span>
            </button>
            <button type="button" class="option" data-select role="radio" aria-checked="false">
              <span class="radio" aria-hidden="true"></span><span class="ao-key" aria-hidden="true">C</span><span class="ao-opt-text">图为有向图</span>
            </button>
            <button type="button" class="option" data-select role="radio" aria-checked="false">
              <span class="radio" aria-hidden="true"></span><span class="ao-key" aria-hidden="true">D</span><span class="ao-opt-text">图中存在环</span>
            </button>
          </div>

          <p class="ao-tip">
            <span data-icon="info" aria-hidden="true"></span>
            <span>本题为单选，选择后自动保存。<span class="ao-saved"><span data-icon="check-circle" aria-hidden="true"></span>草稿已保存 16:30</span></span>
          </p>
        </article>

        <div class="banner banner--neutral ao-note" role="note">
          <span data-icon="clock" aria-hidden="true"></span>
          <div>考试剩余 42:18 · 交卷后不可修改，未作答的题按 0 分计。</div>
        </div>
      </div>
    </main>
  </div>

  <div class="actionbar ao-actionbar">
    <button type="button" class="btn btn--secondary">上一题</button>
    <button type="button" class="btn btn--primary" data-goto="student-answer-code">下一题</button>
    <button type="button" class="btn btn--danger-soft" data-goto="student-submit-confirm">交卷</button>
  </div>

  <script src="../assets/screens.js"></script>
  <script src="../assets/screen.js"></script>
</body>
</html>
