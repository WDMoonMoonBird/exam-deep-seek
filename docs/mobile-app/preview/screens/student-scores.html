<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>成绩列表 · 移动端设计稿</title>
<link rel="stylesheet" href="../../../../client/src/styles/tokens.css">
<link rel="stylesheet" href="../../02-design-tokens.css">
<link rel="stylesheet" href="../assets/screen.css">
<style>
  /* 成绩列表局部样式（ss- 前缀），只使用令牌变量 */
  .ss-title .between { align-items: flex-start; }
  .ss-title h1 { flex: 1; min-width: 0; }
  .ss-title .iconbtn { margin-top: -4px; color: var(--text-tertiary); }
  .ss-overview { background: var(--bg-selected); border-color: var(--status-info-bd); }
  .ss-k { font-size: 13px; color: var(--text-secondary); font-weight: var(--m-fw-medium); }
  .ss-hero { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 6px; }
  .ss-big { font-size: 44px; line-height: 1; font-weight: var(--m-fw-bold); letter-spacing: -0.03em; color: var(--text-brand); font-variant-numeric: tabular-nums; }
  .ss-big .ss-total { font-size: 14px; font-weight: var(--m-fw-medium); color: var(--text-tertiary); margin-left: 5px; letter-spacing: 0; }
  .ss-rank { text-align: right; }
  .ss-rank .v { display: block; font-size: 19px; font-weight: var(--m-fw-bold); color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .ss-rank .k { font-size: 11.5px; color: var(--text-tertiary); }
  .ss-dist { display: flex; height: 8px; margin-top: 16px; border-radius: 999px; overflow: hidden; background: var(--score-track); }
  .ss-seg { display: block; height: 100%; }
  .ss-seg + .ss-seg { margin-left: 2px; }
  .ss-seg--excellent { background: var(--score-excellent); }
  .ss-seg--good { background: var(--score-good); }
  .ss-seg--pass { background: var(--score-pass); }
  .ss-legend { display: flex; align-items: center; flex-wrap: wrap; margin-top: 9px; font-size: 11.5px; color: var(--text-secondary); }
  .ss-legend span { display: inline-flex; align-items: center; margin-right: 14px; }
  .ss-dot { width: 8px; height: 8px; border-radius: 3px; margin-right: 5px; }
  .ss-dot--excellent { background: var(--score-excellent); }
  .ss-dot--good { background: var(--score-good); }
  .ss-dot--pass { background: var(--score-pass); }
  .ss-extra { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-subtle); font-size: 12px; color: var(--text-secondary); }
  .ss-grade { width: 100%; text-align: left; }
  .ss-grade .row-main { display: flex; flex-direction: column; }
  .ss-grade .row-sub { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ss-side { display: flex; align-items: center; }
  .ss-num { font-size: 24px; font-weight: var(--m-fw-bold); line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .ss-num--excellent { color: var(--score-excellent); }
  .ss-num--good { color: var(--score-good); }
  .ss-num--pass { color: var(--score-pass); }
  .ss-side .tag { margin-left: 7px; }
  .ss-side .chevron { margin-left: 4px; }
  .ss-pending { width: 100%; text-align: left; }
  .ss-pending .row-main { display: flex; flex-direction: column; }
  .ss-pending .row-sub { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ss-note { margin: 14px 0 4px; text-align: center; font-size: 11.5px; line-height: 1.6; color: var(--text-tertiary); }
  .ss-hint { margin: 8px var(--m-gutter) 0; font-size: 11.5px; color: var(--text-tertiary); }
</style>
</head>
<body class="screen" data-screen="student-scores" data-bottom="tabbar">
  <div data-tabbar="student" data-active="scores"></div>

  <div class="app">
    <main class="scroll">
      <div class="page-title ss-title">
        <div class="between">
          <h1>成绩</h1>
          <button type="button" class="iconbtn" aria-label="成绩计算说明"><span data-icon="info"></span></button>
        </div>
        <p>2026 秋季学期 · 已出分 3/4 · 平均分 85.3</p>
      </div>

      <div class="page">
        <article class="card ss-overview">
          <div class="between">
            <span class="ss-k">学期平均分</span>
            <span class="tag tag--success"><i class="dot"></i>良好</span>
          </div>
          <div class="ss-hero">
            <div class="ss-big tnum">85.3<span class="ss-total">/ 100</span></div>
            <div class="ss-rank">
              <span class="v tnum">6/45</span>
              <span class="k">班级排名</span>
            </div>
          </div>
          <div class="ss-dist" role="img" aria-label="已出分 3 门的等级分布：优秀 1 门、良好 1 门、及格 1 门">
            <span class="ss-seg ss-seg--excellent" style="width:33.3%"></span>
            <span class="ss-seg ss-seg--good" style="width:33.3%"></span>
            <span class="ss-seg ss-seg--pass" style="width:33.4%"></span>
          </div>
          <div class="ss-legend">
            <span><i class="ss-dot ss-dot--excellent"></i>优秀 1</span>
            <span><i class="ss-dot ss-dot--good"></i>良好 1</span>
            <span><i class="ss-dot ss-dot--pass"></i>及格 1</span>
            <span class="muted">待出分 1</span>
          </div>
          <p class="ss-extra">超过班级 86% 的同学 · 还差 4.7 分进入优秀档</p>
        </article>
      </div>

      <div class="sec">
        <h2>已出分</h2>
        <span class="sec-note">3 份</span>
      </div>
      <div class="page">
        <div class="list">
          <button type="button" class="rowitem rowitem--tap ss-grade" data-goto="student-score-detail" aria-label="Java 程序设计期末考试 92 分，等级 A，查看反馈">
            <span class="row-main">
              <span class="row-title">Java 程序设计期末考试</span>
              <span class="row-sub">2026-09-28 · 6 题 · 用时 96 分钟</span>
            </span>
            <span class="row-side ss-side">
              <span class="ss-num ss-num--excellent">92</span>
              <span class="tag tag--success">A</span>
              <span class="chevron" data-icon="chevron-right" aria-hidden="true"></span>
            </span>
          </button>
          <button type="button" class="rowitem rowitem--tap ss-grade" data-goto="student-score-detail" aria-label="数据结构实验二：栈与队列 88 分，等级 B+，查看反馈">
            <span class="row-main">
              <span class="row-title">数据结构实验二：栈与队列</span>
              <span class="row-sub">2026-09-20 · 6 题 · 用时 72 分钟</span>
            </span>
            <span class="row-side ss-side">
              <span class="ss-num ss-num--good">88</span>
              <span class="tag tag--info">B+</span>
              <span class="chevron" data-icon="chevron-right" aria-hidden="true"></span>
            </span>
          </button>
          <button type="button" class="rowitem rowitem--tap ss-grade" data-goto="student-score-detail" aria-label="计算机组成原理第 3 次作业 76 分，等级 C，查看反馈">
            <span class="row-main">
              <span class="row-title">计算机组成原理 · 第 3 次作业</span>
              <span class="row-sub">2026-09-15 · 4 题 · 用时 51 分钟</span>
            </span>
            <span class="row-side ss-side">
              <span class="ss-num ss-num--pass">76</span>
              <span class="tag tag--warning">C</span>
              <span class="chevron" data-icon="chevron-right" aria-hidden="true"></span>
            </span>
          </button>
        </div>
      </div>

      <p class="ss-hint">点击任一成绩可查看逐题得分与 AI 评语</p>

      <div class="sec">
        <h2>待出分</h2>
        <span class="sec-note">1 份</span>
      </div>
      <div class="page">
        <div class="list">
          <div class="rowitem ss-pending">
            <span class="rowicon rowicon--warning" aria-hidden="true"><span data-icon="clock"></span></span>
            <span class="row-main">
              <span class="row-title">用户管理系统（前端）实训</span>
              <span class="row-sub">已提交 10-08 21:14 · 6.3 MB</span>
            </span>
            <span class="tag tag--warning"><i class="dot"></i>待评分</span>
          </div>
        </div>
        <p class="ss-note">成绩由 AI 评分与教师复核共同产生 · 出分后会推送通知</p>
      </div>
    </main>
  </div>

  <script src="../assets/screens.js"></script>
  <script src="../assets/screen.js"></script>
</body>
</html>
