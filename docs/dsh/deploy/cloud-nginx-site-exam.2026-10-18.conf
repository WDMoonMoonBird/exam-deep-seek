# --- CSP (R2-B69/B72): 单一真源；把 Report-Only 改成 Content-Security-Policy 即 enforce；删掉 map 与各 add_header 即回滚 ---
map $host $exam_csp_policy {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; frame-src 'self'; form-action 'self'; manifest-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; child-src 'self' blob:";
}

server {
    listen 80;
    server_name deadpan.asia;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name deadpan.asia;
    ssl_certificate /etc/nginx/ssl/deadpan.asia.pem;
    ssl_certificate_key /etc/nginx/ssl/deadpan.asia.key;
    # ★W3 移植：H10 三头（server 级；有 add_header 的子块需各自重复 ⇒ 见下方逐块补齐）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    root /var/www/html;
    # --- error-status: server-level error pages ---
    # 服务器级：根级未知路径（/exam1、/foo、/wp-login.php…）此前返回 nginx 默认页 ⇒ 统一改成本站错误页
    # 注意：本 server 块下其它站点（c_game/rainbowfart/mrs/dev-signal）的同类错误也会显示这些页面
    error_page 400 401 403 405 408 409 410 413 418 429 /exam/error-pages/40x.html;
    error_page 404 /exam/error-pages/404.html;
    error_page 500 501 502 503 504 /exam/error-pages/500.html;
    # --- error-status: server-level error pages (end) ---
    # ★W3 移植：HSTS（仅在 443 块；若日后需用 HTTP 调 API 请移除本行）
    add_header Strict-Transport-Security "max-age=15552000" always;

    location ^~ /exam/api/internal/ {
        return 404;
    }

    location /exam/api/ {
        # 与后端 multer 50MB 上限对齐（默认 1m 会导致上传 413）
        client_max_body_size 60m;
        proxy_buffering off;
        proxy_cache off;
        proxy_pass http://127.0.0.1:3002/api/;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # --- error-status: intercept (start) ---
        proxy_intercept_errors on;
        error_page 502 503 504 /exam/error-pages/502.html;
        error_page 413 = @api413;
        # --- error-status: intercept (end) ---
    }

    location /exam/socket.io/ {
        proxy_pass http://127.0.0.1:3002/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /exam/change-password {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy-Report-Only $exam_csp_policy always;
        try_files /exam/index.html =404;
    }

    location = /exam {
        return 301 /exam/;
    }

    location /exam/ {
        # ★W3：本块有自己的 add_header ⇒ 父块头不继承，需重复
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy-Report-Only $exam_csp_policy always;
        try_files $uri $uri/ =404;
        error_page 404 /exam/error-pages/404.html;
        error_page 500 502 503 504 /exam/error-pages/500.html;
    }

    # 发版缓存策略：index.html 不缓存，assets（hash 文件名）长缓存
    location = /exam/index.html {
        # ★W3：本块有自己的 add_header ⇒ 父块头不继承，需重复
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy-Report-Only $exam_csp_policy always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* ^/exam/assets/ {
        # ★W3：本块有自己的 add_header ⇒ 父块头不继承，需重复
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location @api413 {
        default_type application/json;
        return 413 '{"code":1403,"message":"文件超过大小限制","data":null}';
    }
    # --- error-status: shortlist A (start) ---
        location = /exam/login {
            # ★W3：本块有自己的 add_header ⇒ 父块头不继承，需重复
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy-Report-Only $exam_csp_policy always;
        try_files /exam/index.html =404;
    }
        location = /exam/doc {
            # ★W3：本块有自己的 add_header ⇒ 父块头不继承，需重复
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy-Report-Only $exam_csp_policy always;
        try_files /exam/index.html =404;
    }
        location = /exam/doc/demos {
            # ★W3：本块有自己的 add_header ⇒ 父块头不继承，需重复
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy-Report-Only $exam_csp_policy always;
        try_files /exam/index.html =404;
    }
        location ~ ^/exam/m(/|$) {
        try_files $uri $uri/ /exam/index.html;
    }
    location ~ ^/exam/(teacher|student|admin)(/|$) {
            # ★W3：本块有自己的 add_header ⇒ 父块头不继承，需重复
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy-Report-Only $exam_csp_policy always;
        try_files $uri $uri/ /exam/index.html;
    }
    location ~* "^/exam/(?!api/|socket\.io/).+\.[a-z0-9]{2,5}$" {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy-Report-Only $exam_csp_policy always;
        try_files $uri =404;
    }
    # --- error-status: shortlist A (end) ---

    location = /c_game {
        return 301 /c_game/;
    }

    location /c_game/ {
        alias /var/www/c_game/;
        try_files $uri $uri/ /c_game/index.html;
    }

    location = /rainbowfart {
        return 301 /rainbowfart/;
    }

    location /rainbowfart/api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /rainbowfart/ {
        alias /var/www/rainbow-fart/client/dist/;
        try_files $uri $uri/ /rainbowfart/index.html;
    }

    location = /mrs {
        return 301 https://$host/mrs/;
    }

    location /mrs/ {
        try_files $uri $uri/ /mrs/index.html;
    }

    location /mrs/downloads/ {
        types {
            application/octet-stream dmg exe zip;
        }
        try_files $uri =404;
    }

    # ---- DevSignal 技术信息聚合平台 ----
    location = /dev-signal {
        return 301 /dev-signal/;
    }

    location /dev-signal/ {
        # ★W3：本块有自己的 add_header ⇒ 父块头不继承，需重复
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        alias /var/www/dev-signal/dist/;
        try_files $uri $uri/ /dev-signal/index.html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 入口不缓存：否则每次部署后老访客 30 天内看不到新版本
    location = /dev-signal/index.html {
        # ★W3：本块有自己的 add_header ⇒ 父块头不继承，需重复
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        alias /var/www/dev-signal/dist/index.html;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # PWA：sw.js 与 manifest 必须 no-cache，否则 Service Worker 更新失效
    location = /dev-signal/sw.js {
        # ★W3：本块有自己的 add_header ⇒ 父块头不继承，需重复
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        alias /var/www/dev-signal/dist/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /dev-signal/manifest.webmanifest {
        # ★W3：本块有自己的 add_header ⇒ 父块头不继承，需重复
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        alias /var/www/dev-signal/dist/manifest.webmanifest;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API 反向代理（SSE 需要关闭缓冲）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

}
